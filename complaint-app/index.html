<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login-screen" class="login-wrap" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark">CD</div>
      <h1 id="login-title">Complaint Desk</h1>
      <p class="muted">Sign in to continue</p>
      <label>Email<input type="email" id="login-email" required autocomplete="username"></label>
      <label>Password<input type="password" id="login-password" required autocomplete="current-password"></label>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      <p id="login-error" class="form-error" hidden></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark sm">CD</span>
        <span class="app-name" id="app-name">Complaint Desk</span>
        <nav class="nav">
          <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
          <a href="#/complaints" data-nav="complaints">Complaints</a>
          <a href="#/new" data-nav="new" class="nav-new">+ New complaint</a>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="user-email" id="user-email"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="config-warning" class="config-warning" hidden>
    Add your Supabase <b>anon key</b> in <code>config.js</code> to connect the app.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
